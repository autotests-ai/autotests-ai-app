name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require deploy secrets
        run: |
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || {
            echo "::error::Missing secret DEPLOY_SSH_KEY — see README § Autodeploy"
            exit 1
          }

      - name: Deploy on production host
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.DEPLOY_HOST || '212.92.101.15' }}
          username: ${{ vars.DEPLOY_USER || 'qaguru' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/opt/autotests-ai-app}"
            git -C "$APP_DIR" fetch --all
            git -C "$APP_DIR" reset --hard origin/main
            bash "$APP_DIR/deploy/box3-deploy.sh"

<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack — autotests.ai</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/stack/css/stack-tokens.css">
  <link rel="stylesheet" href="/css/link.css">
  <link rel="stylesheet" href="/css/text.css">
  <link rel="stylesheet" href="/stack/css/badge.css">
  <link rel="stylesheet" href="/stack/css/panel.css">
  <link rel="stylesheet" href="/css/icon.css">
  <link rel="stylesheet" href="/css/icon-btn.css">
  <link rel="stylesheet" href="/css/lang-toggle.css">
  <link rel="stylesheet" href="/stack/css/poll-toggle.css">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/stack/css/page.css">
  <link rel="stylesheet" href="/stack/css/stack-page.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/favicon-32.png">
</head>
<body>
  <div id="app-header"></div>
  <script>
    window.headerConfig = {
      brand: { href: 'https://autotests.ai/', label: 'autotests.ai' },
      nav: [
        { href: 'https://autotests.ai/', label: 'Home', testid: 'header-nav-home' },
        { href: '/stack/', label: 'Stack', active: true, testid: 'header-nav-stack' },
      ],
      lang: { default: 'en' },
      theme: { default: 'dark' },
    };
  </script>
  <script type="module" src="/js/header.js"></script>

  <main class="page-shell page-shell--below-header stack-page" data-testid="stack-page">
    <div class="stack-page__error" id="stack-err" hidden></div>
    <div id="stack-root"></div>
  </main>
  <script type="module">
    import { bootStackPage } from '/stack/js/stack-matrix.js';
    bootStackPage(document.getElementById('stack-root'), {
      errEl: document.getElementById('stack-err'),
      matrixUrl: '/stack/matrix.json',
    });
  </script>
</body>
</html>

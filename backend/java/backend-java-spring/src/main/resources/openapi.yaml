openapi: 3.1.0
info:
  title: autotests-ai-multistack-app API
  version: 0.1.0
  description: |
    Shared contract for all stacks (`projects/autotests-ai-multistack-home/autotests-ai-multistack-app/_contract/flows/login.md`).
    SSOT implementation: `projects/autotests-ai-multistack-home/autotests-ai-multistack-app/backend/java/backend-java-spring`.
    Auth endpoints: login, register, logout, profile, self-delete — see `flows/login.md`.

servers:
  - url: http://localhost:8080
    description: Local Spring Boot (default SERVER_PORT)

paths:
  /api/health:
    get:
      operationId: apiHealth
      summary: Application health (used by tests healthCheck)
      tags: [system]
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: backend-java-spring

  /api/items:
    get:
      operationId: listItems
      summary: List seeded items from PostgreSQL
      tags: [items]
      responses:
        "200":
          description: Items loaded from database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemsResponse"

  /api/auth/register:
    post:
      operationId: register
      summary: Create account and return JWT
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Username already taken

  /api/auth/login:
    post:
      operationId: login
      summary: Form login — returns JWT for localStorage authToken
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /api/auth/logout:
    post:
      operationId: logout
      summary: End session (client clears authToken)
      tags: [auth]
      responses:
        "204":
          description: Logged out

  /api/auth/me:
    get:
      operationId: getProfile
      summary: Current user profile (Bearer JWT)
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteAccount
      summary: Delete the authenticated account (Bearer JWT)
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Account removed
        "401":
          description: Unauthorized

  /api/oauth/github:
    post:
      operationId: githubOAuthExchange
      summary: Exchange a GitHub OAuth code for login. Never returns a token or PAT.
      tags: [oauth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubOAuthRequest"
      responses:
        "200":
          description: GitHub login only. Token is an httpOnly cookie, never the JSON body.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: httpOnly GitHub access token (github_oauth); Path=/api/oauth; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubOAuthLoginResponse"
              example:
                login: octocat
        "400":
          description: Missing code or state
        "401":
          description: GitHub exchange failed or login missing
        "503":
          description: OAuth App secret is not configured

  /api/oauth/github/repos:
    post:
      operationId: githubOAuthCreateRepo
      summary: Create the public repo named coverageProfile.automation.e2e.stack from Home YAML. Never frozen. Never returns a token or PAT. Never pushes files.
      tags: [oauth]
      security:
        - githubOAuthCookie: []
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
            example: |
              destination: user
              coverageProfile:
                automation:
                  e2e:
                    stack: python-pytest
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Repo URL; created is true even when the repo already existed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubOAuthRepoResponse"
              example:
                login: octocat
                url: https://github.com/octocat/python-pytest
                created: true
        "400":
          description: YAML body missing or coverageProfile.automation.e2e.stack missing. Never a frozen stack.
        "401":
          description: Missing or invalid GitHub OAuth cookie

  /api/oauth/github/repos/contents:
    post:
      operationId: githubOAuthPushTree
      summary: Push unzip of dest zip from Home YAML onto the repo named coverageProfile.automation.e2e.stack. Never classpath assemble-landing.yaml. Never a token or PAT.
      tags: [oauth]
      security:
        - githubOAuthCookie: []
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
            example: |
              destination: zip
              coverageProfile:
                automation:
                  e2e:
                    stack: python-pytest
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Repo URL; pushed is true even when GitHub already had the same tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubOAuthPushResponse"
              example:
                login: octocat
                url: https://github.com/octocat/python-pytest
                pushed: true
        "400":
          description: YAML body missing or coverageProfile.automation.e2e.stack missing. Never a classpath assemble-landing.yaml stub.
        "401":
          description: Missing or invalid GitHub OAuth cookie or empty assemble zip
        "503":
          description: ASSEMBLE_URL missing or assemble-zip stand did not return a zip

  /api/oauth/idp:
    post:
      operationId: idpOAuthExchange
      summary: Exchange a school IdP code for login. Never returns a token. Never GitHub. Never create.
      tags: [oauth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdpOAuthRequest"
      responses:
        "200":
          description: School login only. Token and id_token stay on the backend. No cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdpOAuthLoginResponse"
              example:
                login: qaguru
        "400":
          description: Missing code, state, or redirectUri
        "401":
          description: IdP exchange failed or login missing / unknown
        "503":
          description: IdP client secret or token/userinfo URL is not configured

  /api/assemble:
    post:
      operationId: assembleDestZip
      summary: Dest zip bytes from Home YAML via ASSEMBLE_URL. Same-origin. Browser CORS to assemble-zip is not the happy path. Never catalog/cloud/user channel.
      tags: [assemble]
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
            example: |
              destination: zip
              coverageProfile:
                automation:
                  e2e:
                    stack: python-pytest
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Zip bytes. Destination forced zip. Never a classpath stub.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="assemble.zip"
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: YAML body missing
        "503":
          description: ASSEMBLE_URL missing or assemble-zip stand did not return a zip

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: backend-java-spring

    ItemDto:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Alpha
        description:
          type: string
          example: First seeded item from PostgreSQL

    ItemsResponse:
      type: object
      required: [items, source]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ItemDto"
        source:
          type: string
          example: postgresql

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: newuser
        password:
          type: string
          format: password
          example: password123

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: user1
        password:
          type: string
          format: password
          example: password1

    AuthResponse:
      type: object
      required: [token, username, redirectUrl]
      properties:
        token:
          type: string
          description: JWT stored in localStorage authToken
        username:
          type: string
          example: user1
        redirectUrl:
          type: string
          example: /

    UserProfileResponse:
      type: object
      required: [username]
      properties:
        username:
          type: string
          example: user1

    GithubOAuthRequest:
      type: object
      required: [code, state]
      additionalProperties: false
      properties:
        code:
          type: string
          example: gho_exchange_code
        state:
          type: string
          example: csrf-state

    GithubOAuthLoginResponse:
      type: object
      required: [login]
      additionalProperties: false
      properties:
        login:
          type: string
          example: octocat
      description: GitHub login only. token, access_token, and PAT must not appear.

    GithubOAuthRepoResponse:
      type: object
      required: [login, url, created]
      additionalProperties: false
      properties:
        login:
          type: string
          example: octocat
        url:
          type: string
          example: https://github.com/octocat/python-pytest
        created:
          type: boolean
          example: true
      description: Never token, access_token, or PAT. created is true if the repo exists after this call.

    GithubOAuthPushResponse:
      type: object
      required: [login, url, pushed]
      additionalProperties: false
      properties:
        login:
          type: string
          example: octocat
        url:
          type: string
          example: https://github.com/octocat/python-pytest
        pushed:
          type: boolean
          example: true
      description: Never token, access_token, or PAT. pushed is true if the assemble tree is on main.

    IdpOAuthRequest:
      type: object
      required: [code, state, redirectUri]
      additionalProperties: false
      properties:
        code:
          type: string
          example: idp-exchange-code
        state:
          type: string
          example: csrf-state
        redirectUri:
          type: string
          example: http://localhost:8081/oauth/idp/callback
      description: Never a token. redirectUri matches authorize. Not a GitHub callback.

    IdpOAuthLoginResponse:
      type: object
      required: [login]
      additionalProperties: false
      properties:
        login:
          type: string
          example: qaguru
      description: School login only. token, access_token, id_token, and PAT must not appear. created is not this response.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    githubOAuthCookie:
      type: apiKey
      in: cookie
      name: github_oauth

tags:
  - name: system
    description: Health and ops
  - name: items
    description: Demo CRUD/read API
  - name: auth
    description: Authentication per flows/login.md
  - name: oauth
    description: GitHub OAuth for dest user (login cookie). School IdP for dest cloud (login only, no cookie, never a token in JSON)

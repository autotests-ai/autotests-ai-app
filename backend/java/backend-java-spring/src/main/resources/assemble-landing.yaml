# Home dump → assemble-zip POST /assemble (destination zip only).
# Same coverage as dest zip. Never a PAT. User GitHub dest is OAuth, not this YAML.

preset: multistack-clone
dest: generated-projects/assemble-from-landing-home
zip: generated-projects/assemble-from-landing-home.zip
destination: zip
coverageProfile:
  product:
    backend:
      stack: java-spring
      access: write
    frontend:
      stack: typescript-react
      access: write
  automation:
    unit:
      access: write
      stack: java-spring
      module: backend/java/backend-java-spring
    integration:
      access: write
      stack: java-spring
      module: backend/java/backend-java-spring
    component:
      access: write
      stack: typescript-react
      module: frontend/typescript/frontend-typescript-react
    api:
      access: write
      stack: java-junit5-rest_assured-selenide
      module: tests/java/tests-java-junit5-rest_assured-selenide
    ui:
      access: write
      stack: java-junit5-rest_assured-selenide
      module: tests/java/tests-java-junit5-rest_assured-selenide
    e2e:
      access: write
      stack: java-junit5-rest_assured-selenide
      module: tests/java/tests-java-junit5-rest_assured-selenide
    manual:
      access: write
      stack: java-junit5-rest_assured-selenide
      module: tests/java/tests-java-junit5-rest_assured-selenide
    load: none
  harness:
    agents:
      cline: none
      cursor: none

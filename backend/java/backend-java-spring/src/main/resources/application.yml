spring:
  application:
    name: backend-java-spring
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autotests_ai}
    username: ${DB_USER:autotests}
    password: ${DB_PASSWORD:autotests}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

auth:
  jwt:
    secret: ${JWT_SECRET:multistack-dev-secret-change-in-production-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  seed:
    username: ${SEED_USERNAME:user1}
    password: ${SEED_PASSWORD:password1}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}

github:
  oauth:
    client-id: ${GITHUB_OAUTH_CLIENT_ID:}
    client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
    token-url: ${GITHUB_OAUTH_TOKEN_URL:https://github.com/login/oauth/access_token}
    user-url: ${GITHUB_OAUTH_USER_URL:https://api.github.com/user}
    repos-url: ${GITHUB_OAUTH_REPOS_URL:https://api.github.com/user/repos}
    repo-api-base: ${GITHUB_OAUTH_REPO_API_BASE:https://api.github.com/repos}

idp:
  oauth:
    client-id: ${IDP_CLIENT_ID:}
    client-secret: ${IDP_CLIENT_SECRET:}
    token-url: ${IDP_TOKEN_URL:}
    userinfo-url: ${IDP_USERINFO_URL:}

assemble:
  url: ${ASSEMBLE_URL:}

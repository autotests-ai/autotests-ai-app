name: autotests-ai-app

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: autotests_ai
      POSTGRES_USER: autotests
      POSTGRES_PASSWORD: autotests
    volumes:
      # v2: old autotests-ai-app_pgdata is terminal Flyway; do not reuse it.
      - pgdata_v2:/var/lib/postgresql/data
    networks:
      - autotests_ai_app_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotests -d autotests_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-java-spring:
    image: ghcr.io/autotests-ai/autotests-ai-app-backend-java-spring:${IMAGE_TAG:-latest}
    build:
      labels:
        org.opencontainers.image.title: autotests-ai-app-backend-java-spring
        org.opencontainers.image.description: autotests-ai-app · backend-java-spring
        org.opencontainers.image.source: https://github.com/autotests-ai/autotests-ai-app
        org.opencontainers.image.url: https://autotests.ai/
        org.opencontainers.image.vendor: autotests-ai
      context: ./backend/java/backend-java-spring
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: autotests_ai
      DB_USER: autotests
      DB_PASSWORD: autotests
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-autotests-ai-app-dev-secret-change-in-production-min-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autotests_ai_app_internal

  frontend-typescript-react:
    image: ghcr.io/autotests-ai/autotests-ai-app-frontend-typescript-react:${IMAGE_TAG:-latest}
    build:
      labels:
        org.opencontainers.image.title: autotests-ai-app-frontend-typescript-react
        org.opencontainers.image.description: autotests-ai-app · frontend-typescript-react
        org.opencontainers.image.source: https://github.com/autotests-ai/autotests-ai-app
        org.opencontainers.image.url: https://autotests.ai/
        org.opencontainers.image.vendor: autotests-ai
      context: ./frontend/typescript/frontend-typescript-react
    restart: unless-stopped
    networks:
      - autotests_ai_app_internal

  # Same-origin / + /api/ — twin of teaching stand-gateway-ci (real BE, not WireMock).
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/ci/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend-typescript-react:
        condition: service_started
      backend-java-spring:
        condition: service_started
    networks:
      - autotests_ai_app_internal
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8081}:80"

networks:
  autotests_ai_app_internal:
    driver: bridge

volumes:
  pgdata_v2:

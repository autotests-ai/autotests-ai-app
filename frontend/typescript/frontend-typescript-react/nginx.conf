# Static SPA at document root (Vite base `/`).
# Do not SPA-fallback real assets (else missing CSS/JS → text/html MIME errors).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:css|js|mjs|map|png|svg|ico|webmanifest|json|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Defaults for local / CI override via -Dsonar.projectKey / SONAR_PROJECT_KEY.
sonar.projectKey=autotests-ai-multistack-app-frontend-typescript-react
sonar.projectName=autotests-ai-multistack-app-frontend-typescript-react
sonar.sources=src
sonar.tests=src/test
sonar.test.inclusions=src/test/**/*
sonar.exclusions=**/node_modules/**,**/dist/**,**/allure-results/**,**/coverage/**
sonar.coverage.exclusions=src/main.tsx,src/styles.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Canon: in-process JUnit parallel is always 3 (one Gradle JVM; testParallelForks stays 1).
# Selenide WebDriver is thread-local; closeBrowserAfterEach=true.
# Screenshot classes: @Execution(SAME_THREAD) + @ResourceLock(screenshot-compare).
# WireMock scenario tests: @Isolated + SAME_THREAD.
# Debug-only override: -Djunit.jupiter.execution.parallel.config.fixed.parallelism=N
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=3

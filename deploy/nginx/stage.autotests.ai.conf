# Stage twin of autotests.ai.conf — same path-shape, gateway :18081 (deploy/stage.env).
# Upstream name is distinct so prod + stage vhosts can load in one nginx.
upstream stage_autotests_ai_backend {
    server 127.0.0.1:18081;
    keepalive 8;
}

include __STACK_UPSTREAMS_INCLUDE__;

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name stage.autotests.ai;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/stage.autotests.ai.access.log;
    error_log  /var/log/nginx/stage.autotests.ai.error.log;

    location ~ ^/backend- {
        return 301 /stack$request_uri;
    }

    location = /stack {
        return 301 /stack/;
    }

    location = /stack/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://stage_autotests_ai_backend;
    }

    location = /stack/matrix.json {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://stage_autotests_ai_backend;
    }

    location ~ ^/stack/backend-[^/]+/frontend-[^/]+/stack(/|$) {
        return 404;
    }

    include __STACK_ROUTES_INCLUDE__;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://stage_autotests_ai_backend;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://stage_autotests_ai_backend;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name stage.autotests.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

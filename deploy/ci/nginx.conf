# Landing gateway — same-origin / + /api/ (prod path shape).
# Twin of teaching stand-gateway-ci: /api/ → backend-java-spring, / → frontend-typescript-react.
# Docker embedded DNS, re-resolved per request. A static `upstream` block pins the container
# IP at gateway startup, so every rebuild leaves this proxy answering 502 until the
# gateway itself is recreated. Resolving through a variable keeps the stand usable.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        set $backend_upstream "backend-java-spring:8080";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$backend_upstream;
    }

    location / {
        set $frontend_upstream "frontend-typescript-react:80";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$frontend_upstream;
    }
}
